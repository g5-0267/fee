<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Riddhi">
    <title>Grid</title>
    <link rel="stylesheet" href="">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Courgette&display=swap");
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            min-height:100dvh;
            font-family:"Courgette",sans-serif;
            font-size:16px;
            color:white;
        }
        section{
            padding:10px;
        }
        .box{
            border-radius:10px;
        }
        .gc{
            display:grid;
            gap:1rem;
            grid-template-columns:repeat(2,200px);
            grid-template-rows:repeat(2,100px);
            place-content:center;
        }

    </style>
</head>
<body>
    <section class="box" style="height:10vh; background-color:black;"></section>

    <section class="gc" style="height:80vh; background-color: black;">
        <section class="box" style="height:100px; width:200px; background-color: blue;">
        
        </section>
        <section class="box" style="height:100px; width:200px; background-color: blue;">

        </section>
        <section class="box" style="height:100px; width:200px; background-color: blue;">

        </section>
        <section class="box" style="height:100px; width:200px; background-color: blue;">

        </section>
    </section>

    <section class="box" style="position:absolute; bottom:0; left:0; height:10vh; width:100%; background-color:black;">
    
    </section>
</body>
</html>
