<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Riddhi">
    <title>Flex box</title>
    <link rel="stylesheet" href="">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Courgette&display=swap");
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            min-height:100dvh;
            font-family:"Courgette",sans-serif;
            font-size:16px;
            color:white;
        }
        section{
            padding:10px;
        }
        .fc1{
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
        }
        .fc2{
            display:flex;
            gap:15px;
            flex-direction:row;
            justify-content:center;
            align-items:center;
        }
        .box1{
            border-radius:10px;
            height:100px;
            width:200px;
        }
        .fc3{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-content:center;
        }

    </style>
</head>
<body>
    <section class="box" style="height:10vh; background-color:black;"></section>

    <section class="fc3" style="height:80vh; background-color: black;">

        <section class="fc1" style="height:18vh; background-color: black;">
            <section class="box1" style="background-color: blue;">

            </section>
        </section>


        <section class="fc2" style="height:18vh; background-color: black;">
            <section class="box1" style="background-color: blue;">

            </section>
            <section class="box1" style="background-color: blue;">

            </section>
        </section>


        <section class="fc1" style="height:18vh; background-color:black;">
            <section class="box1" style="background-color: blue;">

            </section>
        </section>
    </section>


    <section class="box" style="position:absolute; bottom:0; left:0; height:10vh; width:100%; background-color:black;">
    
    </section>
</body>
</html>
